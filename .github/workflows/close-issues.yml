name: close-issues

# Paused at the repository owner's request.
# Original automatic trigger: schedule, cron "0 2 * * *".
# To restore execution, restore that trigger and remove the job-level guard below.
on:
  workflow_dispatch:

jobs:
  close:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun script/github/close-issues.ts
